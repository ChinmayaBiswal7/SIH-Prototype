<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 50px;
    }
    .card {
      display: inline-block;
      background: white;
      padding: 20px 40px;
      margin: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      font-size: 22px;
    }
    .label {
      font-weight: bold;
      color: #444;
    }
    .value {
      font-size: 30px;
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚦 Smart Traffic Dashboard</h1>
    <div class="card">
      <div class="label">Vehicle Count</div>
      <div id="vehicle-count" class="value">0</div>
    </div>
    <div class="card">
      <div class="label">Average Speed (km/h)</div>
      <div id="avg-speed" class="value">0</div>
    </div>
  </div>

  <script>
    async function fetchData() {
      try {
        const response = await fetch("http://127.0.0.1:5000/data");
        const data = await response.json();
        document.getElementById("vehicle-count").innerText = data.vehicle_count;
        document.getElementById("avg-speed").innerText = data.avg_speed_kmph;
      } catch (err) {
        console.error("Error fetching data:", err);
      }
    }

    setInterval(fetchData, 1000); // update every 1 second
  </script>
</body>
</html>
